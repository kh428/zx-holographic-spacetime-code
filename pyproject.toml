[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zxholo"
version = "0.1.0"
description = "Build, extract, and benchmark ZX-calculus holographic codes, including their spacetime (foliated) extensions."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pyzx>=0.10",
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "ldpc>=2.4",
    "hypertiling>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.0",
]

[project.scripts]
zxholo = "zxholo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zxholo*", "spacetime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
